server {
    listen ${PORT};
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;
        # Host must be the API's own host, not the browser's host: Render
        # routes by Host header, so forwarding the frontend's host would
        # send the request back to this service in a loop (HTTP 508).
        proxy_set_header Host $proxy_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_server_name on;
    }

    location /hubs/ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;
        # Host must be the API's own host, not the browser's host: Render
        # routes by Host header, so forwarding the frontend's host would
        # send the request back to this service in a loop (HTTP 508).
        proxy_set_header Host $proxy_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_server_name on;
    }
}
