services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickpulse
      POSTGRES_USER: tickpulse
      POSTGRES_PASSWORD: tickpulse
    ports:
      - "5432:5432"
    volumes:
      - tickpulse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickpulse -d tickpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/TickPulse.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__TickPulseDb: Host=postgres;Port=5432;Database=tickpulse;Username=tickpulse;Password=tickpulse
      Redis__ConnectionString: redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  tickpulse-data:
